[project]
name = "portfolio-management"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pytest>=9.0.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.50",
    "typer>=0.26.7",
]
[project.scripts]
seed-db = "portfolio_management.cli.seed_db:app"
get-exchanges = "portfolio_management.cli.get_exchanges:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_management"]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
